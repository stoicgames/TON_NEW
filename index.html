<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- Portrait-only Telegram Mini App viewport -->
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Unity Web Player | TON_PORTAL_NEW</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      :root {
        /* Design/reference resolution */
        --reference-width: 1170;
        --reference-height: 2532;
        --reference-aspect: calc(var(--reference-width) / var(--reference-height));

        /* Telegram/iOS safe-area support */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        background: #000;
      }

      body {
        position: fixed;
        inset: 0;
      }

      /*
       * The host window itself is controlled by Telegram and cannot be resized
       * by normal page CSS. This stage letterboxes the Unity app so that its
       * physical content area always stays at the 1170:2532 aspect ratio.
       */
      #app-stage {
        position: fixed;
        inset:
          var(--safe-top)
          var(--safe-right)
          var(--safe-bottom)
          var(--safe-left);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
      }

      #unity-container {
        position: relative !important;
        left: auto !important;
        top: auto !important;
        transform: none !important;

        /*
         * Fit the largest possible 1170:2532 rectangle inside the Telegram
         * viewport without stretching or cropping.
         */
        width: min(
          100%,
          calc(100dvh * var(--reference-aspect))
        );
        height: min(
          100dvh,
          calc(100vw / var(--reference-aspect))
        );

        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 1170 / 2532;
        overflow: hidden;
        background: #000;
      }

      /*
       * Fallback for browsers that do not support dynamic viewport units.
       */
      @supports not (height: 100dvh) {
        #unity-container {
          width: min(
            100%,
            calc(100vh * var(--reference-aspect))
          );
          height: min(
            100vh,
            calc(100vw / var(--reference-aspect))
          );
        }
      }

      #unity-canvas {
        display: block;
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0;
        background: #000;
      }

      #unity-loading-bar {
        position: absolute !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        z-index: 20;
      }

      #unity-warning {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        z-index: 40;
      }

      /* The Telegram Mini App does not need Unity's desktop footer. */
      #unity-footer {
        display: none !important;
      }

      /*
       * Portrait-only blocker.
       * Telegram may still physically rotate/resize its host window, but game
       * input is blocked until the viewport returns to portrait.
       */
      #portrait-only {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #000;
        color: #fff;
        font: 600 20px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      @media (orientation: landscape) {
        #portrait-only {
          display: flex;
        }

        #app-stage {
          visibility: hidden;
          pointer-events: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app-stage">
      <div id="unity-container" class="unity-mobile">
        <!-- Keep Unity's logical reference resolution at 1170 x 2532. -->
        <canvas
          id="unity-canvas"
          width="1170"
          height="2532"
          tabindex="-1"
        ></canvas>

        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>

        <div id="unity-warning"></div>

        <div id="unity-footer">
          <div id="unity-logo-title-footer"></div>
          <div id="unity-fullscreen-button"></div>
          <div id="unity-build-title">TON_PORTAL_NEW</div>
        </div>
      </div>
    </div>

    <div id="portrait-only" role="alert">
      Please rotate your device back to portrait mode.
    </div>

    <script>
      "use strict";

      const REFERENCE_WIDTH = 1170;
      const REFERENCE_HEIGHT = 2532;

      const canvas = document.querySelector("#unity-canvas");
      const unityContainer = document.querySelector("#unity-container");

      /*
       * Let Unity keep its WebGL render target synchronized to the fitted
       * canvas DOM size. The CSS container controls the aspect ratio.
       */
      function applyReferenceCanvasSize() {
        canvas.setAttribute("width", String(REFERENCE_WIDTH));
        canvas.setAttribute("height", String(REFERENCE_HEIGHT));
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      applyReferenceCanvasSize();

      /*
       * Best-effort Telegram setup. These calls are ignored safely when the
       * page is opened outside Telegram.
       */
      function initializeTelegramMiniApp() {
        const webApp =
          window.Telegram &&
          window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;

        if (!webApp) {
          return;
        }

        try {
          webApp.ready();
          webApp.expand();

          if (typeof webApp.disableVerticalSwipes === "function") {
            webApp.disableVerticalSwipes();
          }
        } catch (error) {
          console.warn("Telegram Mini App initialization warning:", error);
        }
      }

      initializeTelegramMiniApp();

      /*
       * Browser orientation locking is best-effort only. Some browsers allow
       * it only after a user gesture or while fullscreen.
       */
      async function tryLockPortraitOrientation() {
        try {
          if (
            screen.orientation &&
            typeof screen.orientation.lock === "function"
          ) {
            await screen.orientation.lock("portrait");
          }
        } catch (_) {
          // The CSS portrait blocker remains the reliable fallback.
        }
      }

      document.addEventListener(
        "pointerdown",
        tryLockPortraitOrientation,
        { once: true }
      );

      function unityShowBanner(msg, type) {
        const warningBanner =
          document.querySelector("#unity-warning");

        function updateBannerVisibility() {
          warningBanner.style.display =
            warningBanner.children.length
              ? "block"
              : "none";
        }

        const div =
          document.createElement("div");

        div.textContent = msg;
        warningBanner.appendChild(div);

        if (type === "error") {
          div.style.cssText =
            "background:#b00020;color:#fff;padding:10px;";
        } else {
          if (type === "warning") {
            div.style.cssText =
              "background:#ffd54f;color:#000;padding:10px;";
          }

          setTimeout(function () {
            if (div.parentNode === warningBanner) {
              warningBanner.removeChild(div);
            }

            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      const buildUrl = "Build";
      const loaderUrl =
        buildUrl + "/!TON_WEBGL.loader.js";

      const config = {
        arguments: [],
        dataUrl:
          buildUrl + "/!TON_WEBGL.data",
        frameworkUrl:
          buildUrl + "/!TON_WEBGL.framework.js",
        codeUrl:
          buildUrl + "/!TON_WEBGL.wasm",
        streamingAssetsUrl:
          "StreamingAssets",
        companyName:
          "DefaultCompany",
        productName:
          "TON_PORTAL_NEW",
        productVersion:
          "1.0",
        showBanner:
          unityShowBanner,

        /*
         * Unity follows the fitted DOM canvas size while preserving the
         * 1170:2532 CSS aspect ratio.
         */
        matchWebGLToCanvasSize: true

        /*
         * Uncomment for lower GPU usage on mobile devices:
         * devicePixelRatio: 1
         */
      };

      document
        .querySelector("#unity-loading-bar")
        .style.display = "block";

      const script =
        document.createElement("script");

      script.src = loaderUrl;

      script.onload = function () {
        createUnityInstance(
          canvas,
          config,
          function (progress) {
            document
              .querySelector("#unity-progress-bar-full")
              .style.width =
                (100 * progress) + "%";
          }
        )
          .then(function (unityInstance) {
            document
              .querySelector("#unity-loading-bar")
              .style.display = "none";

            const fullscreenButton =
              document.querySelector(
                "#unity-fullscreen-button"
              );

            if (fullscreenButton) {
              fullscreenButton.onclick =
                function () {
                  unityInstance.SetFullscreen(1);
                  tryLockPortraitOrientation();
                };
            }
          })
          .catch(function (message) {
            alert(message);
          });
      };

      document.body.appendChild(script);

      /*
       * Re-apply canvas CSS after Telegram viewport changes, keyboard changes,
       * browser toolbar changes, or orientation changes.
       */
      function refreshViewport() {
        applyReferenceCanvasSize();

        /*
         * Reading innerHeight into a custom property provides an additional
         * fallback for embedded browsers with imperfect viewport-unit support.
         */
        document.documentElement.style.setProperty(
          "--actual-viewport-height",
          window.innerHeight + "px"
        );
      }

      window.addEventListener(
        "resize",
        refreshViewport,
        { passive: true }
      );

      window.addEventListener(
        "orientationchange",
        refreshViewport,
        { passive: true }
      );

      if (window.visualViewport) {
        window.visualViewport.addEventListener(
          "resize",
          refreshViewport,
          { passive: true }
        );
      }

      refreshViewport();
    </script>
  </body>
</html>
